name: Daily Chip Briefing Update

on:
  schedule:
    # Starts at 20:00 UTC (05:00 KST). GitHub fires scheduled runs 40-170
    # minutes late on this repo, but the collection window is a rolling 24 hours
    # that ends when the run starts, so a late start only shifts the window.
    - cron: '0 20 * * *'
    # Hourly check: runs the collector again only when today's briefing is
    # missing or degraded, so a bad hour on the model host is retried.
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
    inputs:
      force:
        description: Run the collector even when today's briefing already looks fine
        type: boolean
        default: false

permissions:
  contents: write # Required to push commits back to the repo

concurrency:
  group: chip-briefing-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install image dependency
        run: python -m pip install --quiet --disable-pip-version-check pillow

      - name: Check if the briefing needs another attempt
        id: check
        env:
          CHIP_BRIEFING_FORCE: ${{ github.event.inputs.force }}
        run: python scripts/needs_retry.py

      - name: Run collector
        if: steps.check.outputs.retry == 'yes'
        env:
          CHIP_BRIEFING_LLM_API_KEY: ${{ secrets.GEMINI_API }}
          CHIP_BRIEFING_LLM_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai
          CHIP_BRIEFING_LLM_MODEL: gemma-4-31b-it
          CHIP_BRIEFING_LLM_MAX_ITEMS: "100"
          CHIP_BRIEFING_LLM_TIMEOUT: "90"
          CHIP_BRIEFING_LLM_BUDGET_SECONDS: "7200"
          CHIP_BRIEFING_DAILY_SUMMARY_MAX_ITEMS: "10"
          CHIP_BRIEFING_SECTOR_SUMMARY_TARGET: "10"
          CHIP_BRIEFING_HEADLINE_LIMIT: "20"
          CHIP_BRIEFING_MAX_COMMUNITY_ITEMS: "10"
          CHIP_BRIEFING_COMMUNITY_CANDIDATE_LIMIT: "20"
          CHIP_BRIEFING_COMMUNITY_BATCH_SIZE: "4"
          CHIP_BRIEFING_COMMUNITY_TIMEOUT: "150"
          CHIP_BRIEFING_COMMUNITY_BUDGET_SECONDS: "1800"
          CHIP_BRIEFING_COMMUNITY_POST_FETCH_LIMIT: "20"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          REDDIT_DATA_API_APPROVED: ${{ vars.REDDIT_DATA_API_APPROVED }}
        run: |
          python collect_news.py

      - name: Send Telegram Archive
        if: steps.check.outputs.retry == 'yes'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python send_telegram_archive.py

      - name: Commit and Push changes
        if: steps.check.outputs.retry == 'yes'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add articles.json archive/ assets/thumbs/
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update briefing: $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
            # The run takes a while, so the branch can move under it (another
            # run, or a hand-made commit). Rebase onto the newer tip and retry
            # instead of losing the whole briefing to one rejected push.
            pushed=no
            for attempt in 1 2 3; do
              if git push; then
                pushed=yes
                break
              fi
              echo "push rejected (attempt $attempt); rebasing on the newer tip"
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              sleep 5
            done
            if [ "$pushed" != "yes" ]; then
              echo "Could not push the briefing after three attempts" >&2
              exit 1
            fi
          else
            echo "No changes to commit"
          fi
