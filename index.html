<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="설계, 공정, 소자, 패키징으로 나눠 보는 반도체 데일리 브리핑">
<title>칩 브리핑</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <div class="topbar">
    <span id="updated">업데이트 확인 중</span>
  </div>

  <header class="masthead">
    <h1>칩 브리핑</h1>
  </header>

  <nav class="view-tabs" aria-label="주요 메뉴">
    <button class="view-tab" id="news-tab" type="button" aria-pressed="true" aria-controls="news-view" data-view="news">뉴스</button>
    <button class="view-tab" id="community-tab" type="button" aria-pressed="false" aria-controls="community-view" data-view="community">커뮤니티</button>
    <a class="view-tab" href="archive.html">아카이브</a>
  </nav>

  <main>
    <section class="view" id="news-view" aria-labelledby="news-tab">
      <section class="summary-band" aria-labelledby="daily-summary-title">
        <button class="summary-trigger" id="daily-summary-trigger" type="button" aria-haspopup="dialog" aria-controls="daily-summary-dialog">
          <span class="summary-trigger-title" id="daily-summary-title">Daily Summary</span>
          <span class="summary-trigger-cta">TOP 10 뉴스 보기 <span aria-hidden="true">→</span></span>
        </button>
        <div class="summary-copy" id="daily-summary-container"></div>
      </section>
      <nav class="filters" id="news-filters" aria-label="뉴스 섹터 필터"></nav>
      <section class="news-grid" aria-label="오늘의 주요 뉴스">
        <div class="editorial-column" id="top"></div>
        <div class="editorial-column" id="main"></div>
        <aside class="editorial-column" aria-labelledby="latest-title">
          <h2 class="column-title" id="latest-title">최신 뉴스</h2>
          <div id="side"></div>
        </aside>
      </section>
      <section class="more-section" aria-labelledby="more-news-title">
        <h2 id="more-news-title">더 많은 뉴스</h2>
        <div id="more-news"></div>
      </section>
    </section>

    <section class="view" id="community-view" aria-labelledby="community-tab" hidden>
      <section class="summary-band" aria-labelledby="community-summary-title">
        <h2 id="community-summary-title">Community TOP 10</h2>
        <div class="summary-copy" id="community-sentiment-container"></div>
      </section>
      <nav class="filters" id="community-filters" aria-label="커뮤니티 출처 필터"></nav>
      <section class="community-top-section" aria-labelledby="community-top-title">
        <h2 id="community-top-title">커뮤니티 TOP 10</h2>
        <div class="summary-top10" id="community-top10" aria-label="가중치 점수 상위 10개 커뮤니티 주제"></div>
      </section>
    </section>
  </main>

  <footer class="site-footer">칩 브리핑은 매일 오전 7시, 전날의 반도체 흐름을 정리합니다.</footer>

  <div class="reader summary-dialog" id="daily-summary-dialog" role="dialog" aria-modal="true" aria-labelledby="daily-summary-dialog-title" aria-hidden="true">
    <article class="reader-panel summary-panel" tabindex="-1">
      <button class="close" id="daily-summary-close" aria-label="Daily Summary 닫기">×</button>
      <header class="summary-dialog-header">
        <div class="kicker">Daily Summary</div>
        <h2 id="daily-summary-dialog-title">오늘의 TOP 10 뉴스</h2>
        <div class="meta" id="daily-summary-date"></div>
      </header>
      <div class="summary-overview" id="daily-summary-overview"></div>
      <div class="summary-top10" id="daily-summary-top10" aria-label="중요도 점수 상위 10개 뉴스"></div>
    </article>
  </div>

  <div class="reader" id="reader" role="dialog" aria-modal="true" aria-labelledby="reader-title" aria-hidden="true">
    <article class="reader-panel" tabindex="-1">
      <button class="close" id="close" aria-label="닫기">×</button>
      <div class="kicker" id="reader-sector"></div>
      <h2 id="reader-title"></h2>
      <div class="meta" id="reader-date"></div>
      <div id="reader-source"></div>
      <div class="reader-body" id="reader-body"></div>
    </article>
  </div>
<script type="module" src="assets/js/main.js"></script>
</body>
</html>
