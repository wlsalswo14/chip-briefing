<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="날짜별로 지난 반도체 칩 브리핑을 다시 읽는 아카이브">
<title>브리핑 아카이브 · 칩 브리핑</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/archive.css">
</head>
<body class="archive-page">
  <a class="skip-link" href="#archive-content">본문 바로가기</a>

  <div class="topbar">
    <time id="archive-selected-date">날짜 확인 중</time>
    <a href="index.html">오늘 브리핑 →</a>
  </div>

  <header class="masthead">
    <a class="masthead-link" href="index.html" aria-label="칩 브리핑 홈">
      <span class="masthead-title">칩 브리핑</span>
    </a>
  </header>

  <nav class="view-tabs archive-tabs" aria-label="주요 메뉴">
    <a class="view-tab" href="index.html#news">뉴스</a>
    <a class="view-tab" href="index.html#community">커뮤니티</a>
    <a class="view-tab" href="archive.html" aria-current="page">아카이브</a>
  </nav>

  <section class="archive-intro" aria-labelledby="archive-title">
    <h1 id="archive-title">브리핑 아카이브</h1>
    <p>날짜별로 지난 반도체 브리핑을 다시 읽습니다.</p>
  </section>

  <main class="archive-layout" id="archive-content">
    <aside class="archive-rail" aria-label="브리핑 날짜 선택">
      <div class="archive-rail-sticky">
        <div class="archive-month-nav">
          <button class="archive-month-button" id="archive-prev-month" type="button" aria-label="이전 달">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 2.5 5 8l5.5 5.5"/></svg>
          </button>
          <h2 id="archive-month">연월</h2>
          <button class="archive-month-button" id="archive-next-month" type="button" aria-label="다음 달">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 2.5 11 8l-5.5 5.5"/></svg>
          </button>
        </div>
        <div class="archive-date-list" id="archive-dates" role="listbox" aria-label="날짜 목록"></div>
      </div>
    </aside>

    <article class="archive-edition" aria-live="polite">
      <header class="archive-edition-header">
        <div>
          <h2 id="archive-day-title">브리핑을 불러오는 중입니다.</h2>
          <p id="archive-day-count"></p>
        </div>
        <time id="archive-generated-at"></time>
      </header>

      <section class="archive-summary" aria-labelledby="archive-summary-title">
        <h2 id="archive-summary-title">Daily Summary</h2>
        <div id="archive-summary-copy"><p>요약을 불러오는 중입니다.</p></div>
      </section>

      <section class="archive-top-section" aria-labelledby="archive-top-title">
        <h2 id="archive-top-title">오늘의 TOP 10</h2>
        <div id="archive-top10"></div>
      </section>

      <section class="archive-more-section" aria-labelledby="archive-more-title">
        <h2 id="archive-more-title">더 많은 뉴스</h2>
        <div id="archive-more-news"></div>
      </section>

      <section class="archive-community-section" id="archive-community-section" aria-labelledby="archive-community-title" hidden>
        <h2 id="archive-community-title">커뮤니티 반응</h2>
        <div id="archive-community-summary"></div>
      </section>
    </article>
  </main>

  <footer class="site-footer">칩 브리핑은 매일 오전 7시, 전날의 반도체 흐름을 정리합니다.</footer>

  <div class="reader" id="archive-reader" role="dialog" aria-modal="true" aria-labelledby="archive-reader-title" aria-hidden="true">
    <article class="reader-panel" tabindex="-1">
      <button class="close" id="archive-reader-close" type="button" aria-label="닫기">×</button>
      <div class="kicker" id="archive-reader-meta"></div>
      <h2 id="archive-reader-title"></h2>
      <div class="meta" id="archive-reader-date"></div>
      <div id="archive-reader-source"></div>
      <div class="reader-body" id="archive-reader-body"></div>
    </article>
  </div>

<script type="module" src="assets/js/archive.js"></script>
</body>
</html>
